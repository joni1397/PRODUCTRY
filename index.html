<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Productry</title>
<meta name="description" content="Productry — a simple storefront for selling any product, built for dropshipping and direct sales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
=====================================================================
 PRODUCTRY — single-file storefront (HTML + CSS + JS)
 This file has NO build step. Open it, or publish it, as-is.

 WHERE TO CUSTOMIZE:
 Every setting you'd normally touch lives in ONE place: the
 "CONFIG" block near the top of the <script> at the bottom of
 this file. It is split into clearly labelled sections:
   SECTION A — Store settings (name, currency, announcement bar)
   SECTION B — Formspree (where order emails are sent)
   SECTION C — Payment methods (the buttons shown at checkout)
   SECTION D — Contact details
   SECTION E — Products (the catalog itself)
 Full instructions for each section are in the separate
 README.md guide that was delivered alongside this file.
=====================================================================
-->

<style>
/* ============================================================
   1. DESIGN TOKENS — 6 core colors + 2 typefaces. Change here
   and the whole site updates, since everything below references
   these variables instead of hard-coded colors.
   ============================================================ */
:root{
  --bg:#EEF0F5;          /* page background: cool mist               */
  --surface:#FFFFFF;     /* cards, panels, inputs                    */
  --ink:#182430;         /* primary text + dark surfaces             */
  --teal:#1F7A6C;        /* primary brand accent (buttons, links)    */
  --amber:#E3A93E;       /* secondary accent (badges, highlights)    */
  --coral:#E2694F;       /* tertiary accent (variety, extra tags)    */
  --sky:#4D7EA8;         /* fourth accent (variety, extra tags)      */
  --muted:#5B6B76;       /* secondary text                           */
  --line:rgba(22,32,42,.12);
  --radius:20px;
  --shadow:0 20px 44px -24px rgba(22,32,42,.38);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden}
body.locked{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
img{max-width:100%}

/* ============================================================
   2. INTRO ANIMATION — one deliberate load-in moment, ~3.6s,
   then it never appears again during the session.
   ============================================================ */
#intro{position:fixed;inset:0;z-index:1000;background:var(--ink);display:grid;place-items:center;
  transition:transform 1s cubic-bezier(.77,0,.18,1);}
#intro.hide{transform:translateY(-100%)}
.intro-inner{text-align:center;color:var(--bg)}
.intro-mark{width:80px;height:80px;margin:0 auto 28px;perspective:600px}
.intro-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:cubespin 2.4s cubic-bezier(.4,.1,.2,1) 1}
.intro-cube i{position:absolute;inset:0;border-radius:14px;border:2px solid var(--amber)}
.intro-cube i:nth-child(1){transform:translateZ(40px)}
.intro-cube i:nth-child(2){transform:rotateY(90deg) translateZ(40px)}
.intro-cube i:nth-child(3){transform:rotateX(90deg) translateZ(40px);border-color:var(--teal)}
@keyframes cubespin{from{transform:rotateX(-18deg) rotateY(-30deg) scale(.4);opacity:0}to{transform:rotateX(-18deg) rotateY(330deg) scale(1);opacity:1}}
.intro-word{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:-.02em;display:flex;justify-content:center}
.intro-word span{display:inline-block;opacity:0;transform:translateY(60%) rotate(6deg);animation:letter .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.intro-sub{margin-top:14px;font-size:1.05rem;color:var(--amber);opacity:0;animation:fade .8s 1.9s forwards}
.intro-bar{width:160px;height:3px;background:rgba(255,255,255,.14);border-radius:3px;margin:30px auto 0;overflow:hidden}
.intro-bar i{display:block;height:100%;width:0;background:var(--amber);animation:load 3s .1s ease forwards}
@keyframes load{to{width:100%}}
@keyframes fade{to{opacity:1}}

/* ===================== ANNOUNCEMENT BAR ===================== */
.announce{background:var(--ink);color:var(--amber);text-align:center;font-size:.92rem;font-weight:500;padding:10px 16px;display:none;overflow:hidden}
.announce.on{display:block}
.announce span{display:inline-block;transition:opacity .5s,transform .5s}
.announce span.out{opacity:0;transform:translateY(-8px)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .thumb img{transform:scale(1.06)}
.mini{overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}

/* ===================== 3. HEADER ===================== */
header{position:sticky;top:0;z-index:100;background:rgba(238,240,242,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center;position:relative}
.logo i::after{content:"";width:12px;height:12px;border-radius:3px;background:var(--amber);transform:rotate(12deg)}
nav.links{display:flex;gap:6px}
nav.links a{text-decoration:none;color:var(--ink);font-weight:500;padding:9px 16px;border-radius:999px;position:relative;transition:background .3s,color .3s}
nav.links a:hover{background:var(--surface);box-shadow:var(--shadow)}
.tools{display:flex;align-items:center;gap:10px}
.icon-btn{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:transform .3s,background .3s,box-shadow .3s}
.icon-btn:hover{transform:translateY(-2px) scale(1.06);background:var(--amber);box-shadow:var(--shadow)}
.icon-btn svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--teal);color:#fff;font-size:.72rem;font-weight:600;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.badge.on{transform:scale(1)}
.badge.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.5)}}
.search{position:relative;display:flex;align-items:center}
.search input{width:0;opacity:0;padding:0;height:46px;border:1px solid transparent;border-radius:999px;background:var(--surface);transition:width .45s cubic-bezier(.3,.9,.3,1),opacity .3s,padding .3s,margin .3s;margin-right:0}
.search.open input{width:200px;opacity:1;padding:0 18px;margin-right:8px;border-color:var(--line)}
.menu-toggle{display:none}

/* ===================== 4. HERO ===================== */
.hero{position:relative;padding:84px 0 56px;overflow:hidden}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,5.4vw,3.6rem);line-height:1.05;letter-spacing:-.03em}
.hero p{margin:20px 0 0;max-width:42ch;font-size:1.14rem;color:var(--muted)}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line span{display:block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.loaded .hero h1 .line span{transform:none}
.loaded .hero h1 .line:nth-child(2) span{transition-delay:.12s}
.hero p,.hero .cta{opacity:0;transform:translateY(16px);transition:opacity .9s .5s,transform .9s .5s}
.hero .cta{transition-delay:.7s}
.loaded .hero p,.loaded .hero .cta{opacity:1;transform:none}
.cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}

/* Hero 3D stage: a small rotating stack of "product" faces —
   one deliberate motion moment, communicates "any product fits here". */
.stage{perspective:900px;height:320px;display:grid;place-items:center}
.stage-cube{width:170px;height:170px;position:relative;transform-style:preserve-3d;animation:stagespin 16s linear infinite}
.stage-cube.paused{animation-play-state:paused}
.stage-cube i{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink);backdrop-filter:blur(2px)}
.stage-cube i:nth-child(1){background:var(--teal);color:#fff;transform:translateZ(85px)}
.stage-cube i:nth-child(2){background:var(--amber);transform:rotateY(90deg) translateZ(85px)}
.stage-cube i:nth-child(3){background:var(--coral);color:#fff;transform:rotateY(180deg) translateZ(85px)}
.stage-cube i:nth-child(4){background:var(--sky);color:#fff;transform:rotateY(-90deg) translateZ(85px)}
.stage-cube i:nth-child(5){background:rgba(255,255,255,.94);border:1px solid var(--line);transform:rotateX(90deg) translateZ(85px)}
.stage-cube i:nth-child(6){background:var(--ink);color:#fff;transform:rotateX(-90deg) translateZ(85px)}
@keyframes stagespin{from{transform:rotateX(-16deg) rotateY(0)}to{transform:rotateX(-16deg) rotateY(360deg)}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.stage{height:220px}.stage-cube{width:130px;height:130px}.stage-cube i{transform-origin:center}}

/* ===================== 5. BUTTONS ===================== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:.98rem;transition:transform .3s,box-shadow .3s,background .3s,color .3s;text-decoration:none}
.btn:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#233241}
.btn.soft{background:var(--surface);border:1.5px solid var(--ink);color:var(--ink)}
.btn.soft:hover{background:var(--bg)}
.btn.gold{background:var(--amber);color:var(--ink)}
.btn.block{width:100%}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
.btn.soft .ripple,.btn.gold .ripple{background:rgba(22,32,42,.16)}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* ===================== 6. PRODUCTS SECTION ===================== */
.section{padding:64px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.section-title{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4vw,2.3rem);letter-spacing:-.02em}
.section-sub{color:var(--muted);max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;perspective:1400px}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  opacity:0;transform:translateY(34px);transform-style:preserve-3d;will-change:transform}
.card.in{opacity:1;transform:none}
.card.gone{display:none}
.thumb{aspect-ratio:1/0.92;display:grid;place-items:center;position:relative;overflow:hidden;transform:translateZ(20px)}
.thumb svg{width:56%;height:auto;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .thumb svg{transform:scale(1.07)}
.tag{position:absolute;top:14px;left:14px;background:var(--surface);border-radius:999px;font-size:.78rem;font-weight:600;padding:4px 12px}
.card-body{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1;transform:translateZ(14px)}
.card h3{font-family:var(--display);font-size:1.12rem;line-height:1.25}
.card .desc{font-size:.92rem;color:var(--muted);flex:1}
.price{font-family:var(--display);font-weight:700;font-size:1.28rem;margin:8px 0 6px}
.actions{display:grid;gap:8px}
.actions .btn{padding:12px 16px;font-size:.92rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;display:none}

/* ===================== 7. WHY-US STRIP ===================== */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.strip h4{font-family:var(--display);font-size:1.05rem;margin-bottom:6px}
.strip p{color:var(--muted);font-size:.92rem}
@media(max-width:820px){.strip{grid-template-columns:1fr}}

/* ===================== 8. CONTACT + TERMS ===================== */
.panel{background:var(--ink);color:var(--bg);border-radius:32px;padding:48px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.panel h2{font-family:var(--display);font-size:2rem;letter-spacing:-.02em;margin-bottom:12px}
.panel p{color:#AEBEC7}
.panel a{color:var(--amber);text-decoration:none;font-weight:600}
.contact-list{display:grid;gap:14px;align-content:start}
.contact-list div{background:rgba(255,255,255,.07);border-radius:16px;padding:16px 20px;transition:background .3s,transform .3s}
.contact-list div:hover{background:rgba(255,255,255,.12);transform:translateX(6px)}
.contact-list small{display:block;color:#AEBEC7}
.terms{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:40px}
.terms h3{font-family:var(--display);margin:20px 0 6px;font-size:1.1rem}
.terms p{color:var(--muted);max-width:70ch}
footer{padding:36px 0 46px;text-align:center;color:var(--muted);font-size:.92rem}

/* ===================== 9. CART DRAWER ===================== */
.overlay{position:fixed;inset:0;background:rgba(14,20,26,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:300}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg);z-index:310;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer-head,.drawer-foot{padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.drawer-head{border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:var(--display);font-size:1.4rem}
.drawer-body{flex:1;overflow:auto;padding:16px 24px}
.drawer-foot{flex-direction:column;gap:14px;border-top:1px solid var(--line);align-items:stretch}
.row{display:flex;justify-content:space-between;font-weight:600}
.line-item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;animation:slide .4s both}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
.line-item .mini{width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.line-item .mini svg{width:70%}
.line-item h4{font-size:.95rem;line-height:1.3}
.qty{display:inline-flex;align-items:center;gap:10px;margin-top:6px;background:var(--surface);border-radius:999px;padding:2px 6px;border:1px solid var(--line)}
.qty button{width:26px;height:26px;border-radius:50%;font-size:1.1rem;transition:background .2s}
.qty button:hover{background:var(--amber)}
.remove{font-size:.8rem;color:var(--muted);text-decoration:underline}
.cart-empty{text-align:center;color:var(--muted);padding:60px 0}

/* ===================== 10. CHECKOUT & THANK YOU ===================== */
.modal{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .4s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);border-radius:30px;width:min(640px,100%);max-height:94vh;overflow:auto;padding:34px;position:relative;transform:translateY(40px) scale(.96);transition:transform .55s cubic-bezier(.2,.9,.3,1.1)}
.modal.on .sheet{transform:none}
.close{position:absolute;top:18px;right:18px}
.steps{display:flex;gap:8px;margin-bottom:24px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.steps i.done::after{transform:none}
.sheet h2{font-family:var(--display);font-size:1.7rem;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);margin:4px 0 22px}
.step{display:none}
.step.on{display:block;animation:pop .55s both}
@keyframes pop{from{opacity:0;transform:translateY(18px)}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.85rem;font-weight:600}
.field input,.field textarea{padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .3s,box-shadow .3s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(31,122,108,.22)}
.field input.bad{border-color:#b3493c}
.summary{background:var(--surface);border-radius:18px;padding:16px 18px;margin:20px 0;border:1px solid var(--line)}
.summary .row{font-weight:500;font-size:.95rem;padding:3px 0}
.summary .total{font-weight:700;font-size:1.1rem;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.err{color:#b3493c;font-size:.9rem;margin-top:10px;min-height:1.2em}
.pay{display:grid;gap:14px;margin-top:6px}
.pay button{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;transition:transform .3s,border-color .3s,box-shadow .3s}
.pay button:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:var(--shadow)}
.pay .pi{width:48px;height:48px;border-radius:14px;background:var(--amber);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.pay b{display:block;font-size:1.05rem}
.pay small{color:var(--muted)}
.safe{margin-top:18px;font-size:.85rem;color:var(--muted);text-align:center}
.thanks{text-align:center;padding:10px 0}
.check{width:96px;height:96px;margin:0 auto 20px}
.check circle{fill:#DDEAE6;opacity:.7}
.check .c{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:290;stroke-dashoffset:290}
.check .t{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.step.on .check .c{animation:draw 1s .1s forwards}
.step.on .check .t{animation:draw .6s .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.order-id{display:inline-block;margin:14px 0 24px;background:var(--amber);border-radius:999px;padding:6px 18px;font-weight:600}

/* ===================== 11. TOAST ===================== */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;z-index:500;transition:transform .5s cubic-bezier(.2,.9,.3,1.2);font-weight:500}
.toast.on{transform:translate(-50%,0)}

/* ===================== 12. RESPONSIVE ===================== */
@media(max-width:1020px){.grid{grid-template-columns:repeat(
